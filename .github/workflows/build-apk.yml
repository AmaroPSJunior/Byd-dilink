name: Build BYD Car Control APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build debug and validate sources
        run: |
          node --test tests/hvac-web.test.cjs
          bash ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Upload debug build for testing
        uses: actions/upload-artifact@v4
        with:
          name: byd-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
      - name: Validate signing secrets
        if: github.event_name == 'push'
        env:
          KEYSTORE: ${{ secrets.BYD_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.BYD_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$STOREPASS" || {
            echo "::error::Configure signing secrets before publishing installable releases"; exit 1;
          }
      - name: Build signed release
        if: github.event_name == 'push'
        env:
          BYD_KEYSTORE_BASE64: ${{ secrets.BYD_KEYSTORE_BASE64 }}
          BYD_KEYSTORE_PASSWORD: ${{ secrets.BYD_KEYSTORE_PASSWORD }}
        run: |
          VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.$GITHUB_RUN_NUMBER"
          printf '%s' "$BYD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/byd-release.jks"
          export BYD_KEYSTORE_PATH="$RUNNER_TEMP/byd-release.jks"
          export BYD_KEY_ALIAS="byd-release"
          export BYD_KEY_PASSWORD="$BYD_KEYSTORE_PASSWORD"
          bash ./gradlew assembleRelease "-PreleaseVersionCode=$VERSION_CODE" "-PreleaseVersionName=$VERSION_NAME" --no-daemon
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/byd-car-control-release.apk
          cd artifacts
          sha256sum byd-car-control-release.apk > byd-car-control-release.apk.sha256
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BYD DiLink v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            artifacts/byd-car-control-release.apk
            artifacts/byd-car-control-release.apk.sha256
